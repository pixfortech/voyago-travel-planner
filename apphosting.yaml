# Firebase App Hosting — Cloud Run configuration.
# See https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

env:
  # ── Firebase client config (baked in at build AND available at runtime) ──────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDUNGaUtnMDn4fmtkzAbKGms2HVqXZdJ1U"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "voyago-travel-planner-ai.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "voyago-travel-planner-ai"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "voyago-travel-planner-ai.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "579482732347"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:579482732347:web:5acd4ec7e215052e97d91e"
    availability:
      - BUILD
      - RUNTIME

  # ── Feature flags (baked in at build) ────────────────────────────────────────
  - variable: NEXT_PUBLIC_FLAG_MAP_FEATURES
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # ── Google Maps browser key (client-side JS only — HTTP-referrer restricted) ─
  # DO NOT use this key for server-side API calls. Add GOOGLE_MAPS_API_KEY (below)
  # as an unrestricted secret for server-to-Google communication.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: "AIzaSyDgT7-I43pbNQN8oqeyADgxqVGAv2lswxY"
    availability:
      - BUILD
      - RUNTIME

  # ── AI provider (runtime only — never exposed to the browser) ─────────────────
  # Set to "anthropic" to require ANTHROPIC_API_KEY; "mock" forces the dev mock.
  - variable: AI_PROVIDER
    value: "anthropic"
    availability:
      - RUNTIME

  # ── Server-side secrets (managed via Google Secret Manager) ───────────────────
  # Create these secrets with: gcloud secrets create <name> --data-file=<file>
  # Grant access:  gcloud secrets add-iam-policy-binding <name> \
  #   --member="serviceAccount:<cloud-run-sa>" --role="roles/secretmanager.secretAccessor"

  - variable: GOOGLE_MAPS_API_KEY
    secret: googleMapsApiKey
    availability:
      - RUNTIME

  - variable: ANTHROPIC_API_KEY
    secret: anthropicApiKey
    availability:
      - RUNTIME
